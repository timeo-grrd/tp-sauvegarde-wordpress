# =====================================================================
#  Configuration des scripts de sauvegarde / restauration WordPress
#  Copier ce fichier :  cp config.example.conf config.conf
#  puis adapter config.conf. config.conf n'est PAS versionné (.gitignore).
# =====================================================================

# --- Serveur de production (cette VM) --------------------------------

# Dossiers à sauvegarder et à restaurer (chemins absolus, sans / final).
# Le TP demande /var/www.
# ATTENTION : avec "sudo apt install wordpress", les fichiers WordPress ne
# sont PAS dans /var/www mais dans :
#   /usr/share/wordpress   (le code + wp-content)
#   /etc/wordpress         (config, dont le mot de passe BDD)
# Vérifie chez toi (voir README) et ajoute-les si besoin, par exemple :
#   BACKUP_PATHS=("/var/www" "/usr/share/wordpress" "/etc/wordpress")
BACKUP_PATHS=("/var/www")

# Base de données WordPress à inclure dans l'archive (dump SQL).
# Laisser vide pour ne sauvegarder que les fichiers.
DB_NAME=""

# --- Serveur de sauvegarde --------------------------------------------

BACKUP_USER="ton_user"
BACKUP_HOST="192.168.0.0"
BACKUP_PORT="22"

# Chemin RELATIF au home de BACKUP_USER sur le serveur de sauvegarde
REMOTE_DIR="backups/wordpress"

# Clé SSH dédiée (sans passphrase pour pouvoir automatiser)
SSH_KEY="$HOME/.ssh/id_ed25519_backup"

# Nombre d'archives conservées sur le serveur (0 = tout garder)
KEEP_ARCHIVES=7
