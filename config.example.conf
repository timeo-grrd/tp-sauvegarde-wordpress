# =====================================================================
#  Configuration des scripts de sauvegarde MinIO
#  À installer en /etc/wp-backup/config.conf, propriété de root, en 600 :
#    sudo install -d -m 700 /etc/wp-backup
#    sudo install -m 600 config.example.conf /etc/wp-backup/config.conf
# =====================================================================

# Dossier à sauvegarder
SOURCE_DIR="/var/www"

# Base WordPress ajoutée à l'archive (vide = fichiers seulement)
DB_NAME="wordpress"

# Configuration rclone (adresse + identifiants MinIO), root, en 600
RCLONE_CONFIG_FILE="/etc/wp-backup/rclone.conf"

# Remote rclone + bucket. Chaque sauvegarde y crée un dossier contenant
# archive.tar.gz.enc, metadata.json et cle.key
S3_TARGET="minio:backup-timeo"

# Nombre de sauvegardes conservées dans le bucket (0 = tout garder)
KEEP_ARCHIVES=3

# Itérations PBKDF2 (dérivation de la clé AES). Enregistré dans chaque
# JSON : le changer n'empêche pas de déchiffrer les anciennes sauvegardes.
PBKDF2_ITER=200000

# --- Gestion de la clé symétrique ---------------------------------------
#   fichier       : clé générée par OpenSSL, envoyée en clair dans le bucket
#   vault-kv      : clé rangée dans Vault (moteur KV), le bucket n'a que son chemin
#   vault-transit : clé générée par Vault (moteur Transit), le bucket n'en a
#                   qu'une version chiffrée par Vault (recommandé)
KEY_BACKEND="fichier"

# Vault (inutile si KEY_BACKEND="fichier")
VAULT_ADDR=""                                  # ex. "http://10.1.60.50:8200"
VAULT_TOKEN_FILE="/etc/wp-backup/vault-token"  # le token seul, root, en 600
VAULT_KV_MOUNT="secret"                        # moteur KV v2
VAULT_KV_PREFIX="wp-backup/timeo"              # sous-dossier des clés
VAULT_TRANSIT_MOUNT="transit"                  # moteur Transit
VAULT_TRANSIT_KEY="wp-backup-timeo"            # nom de la clé maîtresse Transit

# Snapshots pris par restore.sh avant d'écraser le site
SNAPSHOT_DIR="/var/backups/wp-backup"

# --- Canal sécurisé : rebond SSH vers MinIO et Vault (optionnel) -------
# Vide = connexion directe à l'adresse de rclone.conf. Si cette adresse
# est en http://, le trafic (dont la clé) circule EN CLAIR sur le réseau.
# Rempli = tout le trafic S3 passe dans un tunnel SSH chiffré.
TUNNEL_SSH=""                                  # ex. "timeo@10.1.60.10"
TUNNEL_PORT="2223"
TUNNEL_KEY="/etc/wp-backup/ssh_key"            # clé privée, root, en 600
TUNNEL_KNOWN_HOSTS="/etc/wp-backup/known_hosts" # empreinte du serveur, root, en 600
TUNNEL_REMOTE="localhost:9000"                 # MinIO vu depuis le bastion
TUNNEL_LOCAL_PORT="19000"
TUNNEL_VAULT_REMOTE=""                         # Vault vu depuis le bastion, ex. "10.1.60.50:8200"
TUNNEL_VAULT_LOCAL_PORT="18200"
